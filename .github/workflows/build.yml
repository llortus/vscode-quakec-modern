# Runs the tests on every push and pull request, and checks that the
# extension packages cleanly. Publishing is handled by publish.yml.
name: Build

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS is pinned because the macos-latest label sometimes fails to
        # find a runner while GitHub moves it to a newer image.
        os: [macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: xvfb-run -a npm run test:integration
        if: runner.os == 'Linux'

      - name: Run integration tests
        run: npm run test:integration
        if: runner.os != 'Linux'

      - name: Check the extension packages
        run: npx vsce ls
        if: runner.os == 'Linux'

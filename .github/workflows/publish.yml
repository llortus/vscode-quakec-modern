# Publishes the extension to the VS Code Marketplace when a GitHub release is
# published. Uses Marketplace Trusted Publishing, so no token is stored in the
# repository. The publisher's Trusted Publishing policy must name this file.
name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check the release tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match package.json version '$version'."
            exit 1
          fi

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: xvfb-run -a npm run test:integration

      - name: Publish to the VS Code Marketplace
        run: npx vsce publish --oidc
